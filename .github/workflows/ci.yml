name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run ktlint
        run: ./gradlew --no-daemon :backend:app:ktlintCheck --console=plain

  backend-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Compile backend
        run: ./gradlew --no-daemon :backend:app:compileKotlin --console=plain

  backend-release-critical-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run guest venue platform route and security tests
        run: |
          _JAVA_OPTIONS=-Xmx4g ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "GuestVenueRoutesTest" \
            --tests "GuestOrderRoutesTest" \
            --tests "GuestOrderIdempotencyFingerprintTest" \
            --tests "GuestVisitRoutesTest" \
            --tests "GuestTableResolveRoutesTest" \
            --tests "GuestTableContextActivationRepositoryTest" \
            --tests "GuestTableContextTeardownRepositoryTest" \
            --tests "PlatformGuestTableMutationCoordinatorTest" \
            --tests "PlatformGuestQrPendingConfirmationStoreTest" \
            --tests "GuestTabsRoutesTest" \
            --tests "GuestStaffCallRoutesTest" \
            --tests "ShiftExtensionRoutesTest" \
            --tests "SupportTicketRoutesTest" \
            --tests "VenueOrderRoutesTest" \
            --tests "VenuePromotionRoutesTest" \
            --tests "VenuePromotionRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest" \
            --tests "AuditLogRepositoryTest" \
            --tests "VenueStaffRoutesTest" \
            --tests "VenueStaffRepositoryTest" \
            --tests "PlatformVenueRoutesTest" \
            --tests "TelegramBotRouterTableTokenTest" \
            --tests "TelegramKeyboardsTest" \
            --console=plain
      - name: Assert route and security test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          expected_classes = [
              "com.hookah.platform.backend.miniapp.guest.GuestVenueRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestOrderRoutesTest",
              "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyFingerprintTest",
              "com.hookah.platform.backend.miniapp.guest.GuestVisitRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestTableResolveRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextActivationRepositoryTest",
              "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextTeardownRepositoryTest",
              "com.hookah.platform.backend.miniapp.guest.db.PlatformGuestTableMutationCoordinatorTest",
              "com.hookah.platform.backend.telegram.PlatformGuestQrPendingConfirmationStoreTest",
              "com.hookah.platform.backend.miniapp.guest.GuestTabsRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestStaffCallRoutesTest",
              "com.hookah.platform.backend.miniapp.shift.ShiftExtensionRoutesTest",
              "com.hookah.platform.backend.support.SupportTicketRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.VenueOrderRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.promotions.VenuePromotionRoutesTest",
              "com.hookah.platform.backend.telegram.db.VenuePromotionRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.AuditLogRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.VenueStaffRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.staff.VenueStaffRepositoryTest",
              "com.hookah.platform.backend.platform.PlatformVenueRoutesTest",
              "com.hookah.platform.backend.telegram.TelegramBotRouterTableTokenTest",
              "com.hookah.platform.backend.telegram.TelegramKeyboardsTest",
          ]
          required_minimums = {
              "com.hookah.platform.backend.miniapp.guest.GuestOrderRoutesTest": 59,
              "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyFingerprintTest": 7,
              "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest": 44,
              "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest": 40,
              "com.hookah.platform.backend.telegram.TelegramBotRouterTableTokenTest": 542,
          }
          totals = {key: 0 for key in ("tests", "skipped", "failures", "errors")}
          problems = []
          for class_name in expected_classes:
              report = report_dir / f"TEST-{class_name}.xml"
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {key: int(suite.attrib.get(key, "0")) for key in totals}
              for key, value in counts.items():
                  totals[key] += value
              minimum_tests = required_minimums.get(class_name, 1)
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete suite: {class_name} "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"non-passing suite {class_name}: {counts}")

          executed = totals["tests"] - totals["skipped"]
          print(
              "Route/security JUnit: "
              f"discovered={totals['tests']} executed={executed} "
              f"skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}"
          )
          if problems:
              raise SystemExit("\n".join(problems))
          PY
      - name: Run mandatory PostgreSQL activation promotion staff menu and guest order concurrency gates
        if: ${{ !cancelled() }}
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "GuestTableContextActivationPostgresTest" \
            --tests "PromotionConfigurationConcurrencyPostgresTest" \
            --tests "VenueStaffMutationConcurrencyPostgresTest" \
            --tests "VenueMenuOptionNormalizationConcurrencyPostgresTest" \
            --tests "GuestOrderIdempotencyConcurrencyPostgresTest" \
            --console=plain
      - name: Assert PostgreSQL activation promotion staff menu and guest order test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          required_suites = [
              (
                  "activation",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest.db."
                      "GuestTableContextActivationPostgresTest.xml"
                  ),
                  8,
              ),
              (
                  "promotion lifecycle/configuration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram.db."
                      "PromotionConfigurationConcurrencyPostgresTest.xml"
                  ),
                  14,
              ),
              (
                  "staff membership concurrency",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue.staff."
                      "VenueStaffMutationConcurrencyPostgresTest.xml"
                  ),
                  2,
              ),
              (
                  "menu option and item create mutation concurrency",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue.menu."
                      "VenueMenuOptionNormalizationConcurrencyPostgresTest.xml"
                  ),
                  31,
              ),
              (
                  "guest order idempotency concurrency",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram.db."
                      "GuestOrderIdempotencyConcurrencyPostgresTest.xml"
                  ),
                  9,
              ),
          ]
          problems = []
          for label, report, minimum_tests in required_suites:
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {
                  key: int(suite.attrib.get(key, "0"))
                  for key in ("tests", "skipped", "failures", "errors")
              }
              executed = counts["tests"] - counts["skipped"]
              print(
                  f"PostgreSQL {label} JUnit: xml={report} "
                  f"discovered={counts['tests']} executed={executed} "
                  f"skipped={counts['skipped']} failures={counts['failures']} "
                  f"errors={counts['errors']} required={minimum_tests}"
              )
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete PostgreSQL {label} matrix: "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"PostgreSQL {label} gate failed: {counts}")

          if problems:
              raise SystemExit("\n".join(problems))
          PY

  backend-venue-booking-rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run venue booking RBAC tests
        run: |
          ./gradlew --no-daemon :backend:app:test \
            --tests "VenueBookingRoutesTest" \
            --tests "VenueRbacRoutesTest" \
            --console=plain

  backend-telegram-lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run Telegram keyboard payload notifier tests
        run: |
          ./gradlew --no-daemon :backend:app:test \
            --tests "TelegramKeyboardsTest" \
            --tests "SendMessagePayloadTest" \
            --tests "StaffChatNotifierTest" \
            --tests "TelegramBotRouterLinkCommandTest" \
            --console=plain

  backend-migration-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run migration sanity tests
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "TelegramDialogStateMigrationTest" \
            --tests "TableSessionsMigrationV28PostgresTest" \
            --tests "AuditLogTargetMigrationH2Test" \
            --tests "AuditLogTargetMigrationPostgresTest" \
            --tests "GuestBatchIdempotencyFingerprintMigrationH2Test" \
            --tests "GuestBatchIdempotencyFingerprintMigrationPostgresTest" \
            --console=plain
      - name: Assert mandatory migration test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          required_suites = [
              (
                  "H2 audit target migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "AuditLogTargetMigrationH2Test.xml"
                  ),
                  2,
              ),
              (
                  "PostgreSQL audit target migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "AuditLogTargetMigrationPostgresTest.xml"
                  ),
                  2,
              ),
              (
                  "H2 guest idempotency fingerprint migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest."
                      "GuestBatchIdempotencyFingerprintMigrationH2Test.xml"
                  ),
                  2,
              ),
              (
                  "PostgreSQL guest idempotency fingerprint migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest."
                      "GuestBatchIdempotencyFingerprintMigrationPostgresTest.xml"
                  ),
                  2,
              ),
          ]
          problems = []
          for label, report, minimum_tests in required_suites:
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {
                  key: int(suite.attrib.get(key, "0"))
                  for key in ("tests", "skipped", "failures", "errors")
              }
              executed = counts["tests"] - counts["skipped"]
              print(
                  f"{label} JUnit: xml={report} "
                  f"discovered={counts['tests']} executed={executed} "
                  f"skipped={counts['skipped']} failures={counts['failures']} "
                  f"errors={counts['errors']} required={minimum_tests}"
              )
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete {label} matrix: "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"{label} gate failed: {counts}")

          if problems:
              raise SystemExit("\n".join(problems))
          PY

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - backend-ktlint
      - backend-compile
      - backend-release-critical-routes
      - backend-venue-booking-rbac
      - backend-telegram-lightweight
      - backend-migration-sanity
    steps:
      - name: Aggregate backend checks
        run: |
          echo "backend-ktlint result: ${{ needs.backend-ktlint.result }}"
          echo "backend-compile result: ${{ needs.backend-compile.result }}"
          echo "backend-release-critical-routes result: ${{ needs.backend-release-critical-routes.result }}"
          echo "backend-venue-booking-rbac result: ${{ needs.backend-venue-booking-rbac.result }}"
          echo "backend-telegram-lightweight result: ${{ needs.backend-telegram-lightweight.result }}"
          echo "backend-migration-sanity result: ${{ needs.backend-migration-sanity.result }}"

          if [[ "${{ needs.backend-ktlint.result }}" != "success" || \
                "${{ needs.backend-compile.result }}" != "success" || \
                "${{ needs.backend-release-critical-routes.result }}" != "success" || \
                "${{ needs.backend-venue-booking-rbac.result }}" != "success" || \
                "${{ needs.backend-telegram-lightweight.result }}" != "success" || \
                "${{ needs.backend-migration-sanity.result }}" != "success" ]]; then
            echo "backend checks failed"
            exit 1
          fi

          echo "backend checks passed"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create CI compose env
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=hookah
          POSTGRES_USER=hookah
          POSTGRES_PASSWORD=ci-placeholder-password
          EOF
      - name: Validate Docker Compose config
        run: docker compose config --quiet

  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Detect miniapp lockfile
        id: miniapp-lockfile
        run: |
          cd miniapp
          lockfiles=()
          if [ -f pnpm-lock.yaml ]; then
            lockfiles+=("pnpm-lock.yaml")
          fi
          if [ -f package-lock.json ]; then
            lockfiles+=("package-lock.json")
          fi
          if [ -f yarn.lock ]; then
            lockfiles+=("yarn.lock")
          fi
          if [ ${#lockfiles[@]} -eq 0 ]; then
            echo "::error::No lockfile found in miniapp/. Expected pnpm-lock.yaml, package-lock.json, or yarn.lock."
            exit 1
          fi
          if [ ${#lockfiles[@]} -gt 1 ]; then
            echo "::warning::Multiple lockfiles detected in miniapp/: ${lockfiles[*]}. Using priority pnpm > npm > yarn."
          fi
          if [ -f pnpm-lock.yaml ]; then
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.miniapp-lockfile.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: 9
      - name: Install dependencies
        working-directory: miniapp
        run: |
          case "${{ steps.miniapp-lockfile.outputs.package_manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            *)
              echo "::error::Unknown package manager."
              exit 1
              ;;
          esac
      - name: Build miniapp
        working-directory: miniapp
        run: |
          case "${{ steps.miniapp-lockfile.outputs.package_manager }}" in
            pnpm)
              pnpm build
              ;;
            npm)
              npm run build
              ;;
            yarn)
              yarn build
              ;;
            *)
              echo "::error::Unknown package manager."
              exit 1
              ;;
          esac

  miniapp-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: miniapp
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: miniapp
        run: npx playwright install --with-deps chromium
      - name: Run Mini App browser smoke
        working-directory: miniapp
        run: npm run e2e:smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        target: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile .
