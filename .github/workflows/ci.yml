name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run ktlint
        run: ./gradlew --no-daemon :backend:app:ktlintCheck --console=plain

  backend-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Compile backend
        run: ./gradlew --no-daemon :backend:app:compileKotlin --console=plain

  backend-release-critical-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run guest venue platform route and security tests
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestVenueRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestOrderRoutesTest" \
            --tests "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyFingerprintTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestVisitRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestTableResolveRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextActivationRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextTeardownRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.db.PlatformGuestTableMutationCoordinatorTest" \
            --tests "com.hookah.platform.backend.telegram.PlatformGuestQrPendingConfirmationStoreTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestTabsRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestStaffCallRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.shift.ShiftExtensionRoutesTest" \
            --tests "com.hookah.platform.backend.support.SupportTicketRoutesTest" \
            --tests "com.hookah.platform.backend.support.SupportThreadReadRepositoryTest" \
            --tests "com.hookah.platform.backend.telegram.TelegramOutboxWorkerTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueOrderRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.promotions.VenuePromotionRoutesTest" \
            --tests "com.hookah.platform.backend.telegram.db.VenuePromotionRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.AuditLogRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueStaffRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.staff.VenueStaffRepositoryTest" \
            --tests "com.hookah.platform.backend.platform.PlatformVenueRoutesTest" \
            --tests "com.hookah.platform.backend.platform.PlatformRoutesTest" \
            --tests "com.hookah.platform.backend.platform.PlatformVenueRepositoryTest" \
            --tests "com.hookah.platform.backend.platform.PlatformVenueMemberRepositoryTest" \
            --tests "com.hookah.platform.backend.platform.VenueOwnerAccountRepositoryTest" \
            --tests "com.hookah.platform.backend.telegram.db.VenueConnectionRequestRepositoryTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueOnboardingRoutesTest" \
            --tests "com.hookah.platform.backend.platform.PlatformOnboardingRoutesTest" \
            --tests "com.hookah.platform.backend.telegram.TelegramBotRouterVenueConnectionRequestFlowTest" \
            --tests "com.hookah.platform.backend.telegram.TelegramBotRouterTableTokenTest" \
            --tests "com.hookah.platform.backend.telegram.TelegramKeyboardsTest" \
            --console=plain
      - name: Assert route and security test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          expected_classes = [
              "com.hookah.platform.backend.miniapp.guest.GuestVenueRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestOrderRoutesTest",
              "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyFingerprintTest",
              "com.hookah.platform.backend.miniapp.guest.GuestVisitRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestTableResolveRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextActivationRepositoryTest",
              "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextTeardownRepositoryTest",
              "com.hookah.platform.backend.miniapp.guest.db.PlatformGuestTableMutationCoordinatorTest",
              "com.hookah.platform.backend.telegram.PlatformGuestQrPendingConfirmationStoreTest",
              "com.hookah.platform.backend.miniapp.guest.GuestTabsRoutesTest",
              "com.hookah.platform.backend.miniapp.guest.GuestStaffCallRoutesTest",
              "com.hookah.platform.backend.miniapp.shift.ShiftExtensionRoutesTest",
              "com.hookah.platform.backend.support.SupportTicketRoutesTest",
              "com.hookah.platform.backend.support.SupportThreadReadRepositoryTest",
              "com.hookah.platform.backend.telegram.TelegramOutboxWorkerTest",
              "com.hookah.platform.backend.miniapp.venue.VenueOrderRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.promotions.VenuePromotionRoutesTest",
              "com.hookah.platform.backend.telegram.db.VenuePromotionRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.AuditLogRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.VenueStaffRoutesTest",
              "com.hookah.platform.backend.miniapp.venue.staff.VenueStaffRepositoryTest",
              "com.hookah.platform.backend.platform.PlatformVenueRoutesTest",
              "com.hookah.platform.backend.platform.PlatformRoutesTest",
              "com.hookah.platform.backend.platform.PlatformVenueRepositoryTest",
              "com.hookah.platform.backend.platform.PlatformVenueMemberRepositoryTest",
              "com.hookah.platform.backend.platform.VenueOwnerAccountRepositoryTest",
              "com.hookah.platform.backend.telegram.db.VenueConnectionRequestRepositoryTest",
              "com.hookah.platform.backend.miniapp.venue.VenueOnboardingRoutesTest",
              "com.hookah.platform.backend.platform.PlatformOnboardingRoutesTest",
              "com.hookah.platform.backend.telegram.TelegramBotRouterVenueConnectionRequestFlowTest",
              "com.hookah.platform.backend.telegram.TelegramBotRouterTableTokenTest",
              "com.hookah.platform.backend.telegram.TelegramKeyboardsTest",
          ]
          required_minimums = {
              "com.hookah.platform.backend.support.SupportTicketRoutesTest": 12,
              "com.hookah.platform.backend.support.SupportThreadReadRepositoryTest": 11,
              "com.hookah.platform.backend.telegram.TelegramOutboxWorkerTest": 8,
              "com.hookah.platform.backend.miniapp.guest.GuestOrderRoutesTest": 61,
              "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyFingerprintTest": 7,
              "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuRepositoryTest": 54,
              "com.hookah.platform.backend.miniapp.venue.VenueMenuRoutesTest": 46,
              "com.hookah.platform.backend.platform.PlatformVenueRoutesTest": 13,
              "com.hookah.platform.backend.platform.PlatformRoutesTest": 9,
              "com.hookah.platform.backend.platform.PlatformVenueRepositoryTest": 1,
              "com.hookah.platform.backend.platform.PlatformVenueMemberRepositoryTest": 1,
              "com.hookah.platform.backend.platform.VenueOwnerAccountRepositoryTest": 9,
              "com.hookah.platform.backend.telegram.db.VenueConnectionRequestRepositoryTest": 11,
              "com.hookah.platform.backend.miniapp.venue.VenueOnboardingRoutesTest": 8,
              "com.hookah.platform.backend.platform.PlatformOnboardingRoutesTest": 15,
              "com.hookah.platform.backend.telegram.TelegramBotRouterVenueConnectionRequestFlowTest": 18,
              "com.hookah.platform.backend.telegram.TelegramBotRouterTableTokenTest": 552,
              "com.hookah.platform.backend.telegram.TelegramKeyboardsTest": 169,
          }
          totals = {key: 0 for key in ("tests", "skipped", "failures", "errors")}
          problems = []
          for class_name in expected_classes:
              report = report_dir / f"TEST-{class_name}.xml"
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {key: int(suite.attrib.get(key, "0")) for key in totals}
              for key, value in counts.items():
                  totals[key] += value
              minimum_tests = required_minimums.get(class_name, 1)
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete suite: {class_name} "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"non-passing suite {class_name}: {counts}")

          executed = totals["tests"] - totals["skipped"]
          print(
              "Route/security JUnit: "
              f"discovered={totals['tests']} executed={executed} "
              f"skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}"
          )
          if problems:
              raise SystemExit("\n".join(problems))
          PY
      - name: Run mandatory PostgreSQL menu mutation gate
        if: ${{ !cancelled() }}
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "com.hookah.platform.backend.miniapp.venue.menu.VenueMenuOptionNormalizationConcurrencyPostgresTest" \
            --console=plain
      - name: Assert mandatory PostgreSQL menu mutation results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(
              "backend/app/build/test-results/test/"
              "TEST-com.hookah.platform.backend.miniapp.venue.menu."
              "VenueMenuOptionNormalizationConcurrencyPostgresTest.xml"
          )
          if not report.is_file():
              raise SystemExit(f"missing JUnit XML: {report}")
          suite = ElementTree.parse(report).getroot()
          counts = {
              key: int(suite.attrib.get(key, "0"))
              for key in ("tests", "skipped", "failures", "errors")
          }
          executed = counts["tests"] - counts["skipped"]
          print(
              f"PostgreSQL menu mutation JUnit: xml={report} "
              f"discovered={counts['tests']} executed={executed} "
              f"skipped={counts['skipped']} failures={counts['failures']} "
              f"errors={counts['errors']} required=44"
          )
          if counts["tests"] < 44:
              raise SystemExit(
                  "incomplete PostgreSQL menu mutation matrix: "
                  f"required=44 actual={counts['tests']}"
              )
          if any(counts[key] for key in ("skipped", "failures", "errors")):
              raise SystemExit(f"PostgreSQL menu mutation gate failed: {counts}")
          PY
      - name: Run mandatory PostgreSQL integrity and concurrency gates
        if: ${{ !cancelled() }}
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "com.hookah.platform.backend.miniapp.guest.db.GuestTableContextActivationPostgresTest" \
            --tests "com.hookah.platform.backend.telegram.db.PromotionConfigurationConcurrencyPostgresTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.staff.VenueStaffMutationConcurrencyPostgresTest" \
            --tests "com.hookah.platform.backend.telegram.db.VenueOnboardingConcurrencyPostgresTest" \
            --tests "com.hookah.platform.backend.telegram.db.GuestOrderIdempotencyConcurrencyPostgresTest" \
            --tests "com.hookah.platform.backend.support.BookingConversationConcurrencyPostgresTest" \
            --tests "com.hookah.platform.backend.support.BookingMessageIdempotencyPostgresTest" \
            --tests "com.hookah.platform.backend.support.SupportThreadReadConcurrencyPostgresTest" \
            --console=plain
      - name: Assert mandatory PostgreSQL integrity and concurrency results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          required_suites = [
              (
                  "activation",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest.db."
                      "GuestTableContextActivationPostgresTest.xml"
                  ),
                  8,
              ),
              (
                  "support-thread read canonical parent lock order",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "SupportThreadReadConcurrencyPostgresTest.xml"
                  ),
                  3,
              ),
              (
                  "promotion lifecycle/configuration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram.db."
                      "PromotionConfigurationConcurrencyPostgresTest.xml"
                  ),
                  14,
              ),
              (
                  "staff membership concurrency",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue.staff."
                      "VenueStaffMutationConcurrencyPostgresTest.xml"
                  ),
                  2,
              ),
              (
                  "guest order idempotency concurrency",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram.db."
                      "GuestOrderIdempotencyConcurrencyPostgresTest.xml"
                  ),
                  9,
              ),
              (
                  "venue onboarding serialization and create-link",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram.db."
                      "VenueOnboardingConcurrencyPostgresTest.xml"
                  ),
                  7,
              ),
              (
                  "booking conversation canonical row lock",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "BookingConversationConcurrencyPostgresTest.xml"
                  ),
                  1,
              ),
              (
                  "booking Mini App message idempotency and transactional outbox",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "BookingMessageIdempotencyPostgresTest.xml"
                  ),
                  11,
              ),
          ]
          problems = []
          for label, report, minimum_tests in required_suites:
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {
                  key: int(suite.attrib.get(key, "0"))
                  for key in ("tests", "skipped", "failures", "errors")
              }
              executed = counts["tests"] - counts["skipped"]
              print(
                  f"PostgreSQL {label} JUnit: xml={report} "
                  f"discovered={counts['tests']} executed={executed} "
                  f"skipped={counts['skipped']} failures={counts['failures']} "
                  f"errors={counts['errors']} required={minimum_tests}"
              )
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete PostgreSQL {label} matrix: "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"PostgreSQL {label} gate failed: {counts}")

          if problems:
              raise SystemExit("\n".join(problems))
          PY

  backend-venue-booking-rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run venue booking RBAC tests
        run: |
          ./gradlew --no-daemon :backend:app:test \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueBookingRoutesTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.VenueRbacRoutesTest" \
            --tests "com.hookah.platform.backend.support.BookingConversationRoutesTest" \
            --tests "com.hookah.platform.backend.support.BookingConversationRepositoryTest" \
            --console=plain
      - name: Assert venue booking and conversation test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          required_suites = [
              (
                  "venue booking routes",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "VenueBookingRoutesTest.xml"
                  ),
                  8,
              ),
              (
                  "venue RBAC routes",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "VenueRbacRoutesTest.xml"
                  ),
                  36,
              ),
              (
                  "booking conversation routes",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                  "BookingConversationRoutesTest.xml"
                  ),
                  5,
              ),
              (
                  "booking conversation repository",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "BookingConversationRepositoryTest.xml"
                  ),
                  12,
              ),
          ]
          problems = []
          for label, report, minimum in required_suites:
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {
                  key: int(suite.attrib.get(key, "0"))
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(f"{label}: xml={report} minimum={minimum} counts={counts}")
              if counts["tests"] < minimum:
                  problems.append(
                      f"incomplete {label}: required={minimum} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"non-passing {label}: {counts}")

          if problems:
              raise SystemExit("\n".join(problems))
          PY

