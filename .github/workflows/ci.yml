  backend-migration-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-key-prefix: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify Docker availability (required for Testcontainers)
        run: docker info
      - name: Run migration sanity tests
        run: |
          JAVA_TOOL_OPTIONS=-Dapi.version=1.44 _JAVA_OPTIONS=-Xmx4g \
            ./gradlew --no-daemon --max-workers=1 :backend:app:test \
            --tests "com.hookah.platform.backend.telegram.TelegramDialogStateMigrationTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.TableSessionsMigrationV28PostgresTest" \
            --tests "com.hookah.platform.backend.miniapp.venue.AuditLogTargetMigrationH2Test" \
            --tests "com.hookah.platform.backend.miniapp.venue.AuditLogTargetMigrationPostgresTest" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestBatchIdempotencyFingerprintMigrationH2Test" \
            --tests "com.hookah.platform.backend.miniapp.guest.GuestBatchIdempotencyFingerprintMigrationPostgresTest" \
            --tests "com.hookah.platform.backend.support.BookingThreadIntegrityMigrationH2Test" \
            --tests "com.hookah.platform.backend.support.BookingThreadIntegrityMigrationPostgresTest" \
            --tests "com.hookah.platform.backend.support.BookingAuditReferencePolicyTest" \
            --tests "com.hookah.platform.backend.support.BookingMessageIdempotencyMigrationH2Test" \
            --tests "com.hookah.platform.backend.support.BookingMessageIdempotencyMigrationPostgresTest" \
            --tests "com.hookah.platform.backend.support.BookingThreadIntegrityMigrationConcurrencyPostgresTest" \
            --console=plain
      - name: Assert mandatory migration test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("backend/app/build/test-results/test")
          required_suites = [
              (
                  "H2 Telegram dialog-state migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.telegram."
                      "TelegramDialogStateMigrationTest.xml"
                  ),
                  1,
              ),
              (
                  "PostgreSQL table-session V28 migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest."
                      "TableSessionsMigrationV28PostgresTest.xml"
                  ),
                  1,
              ),
              (
                  "H2 audit target migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "AuditLogTargetMigrationH2Test.xml"
                  ),
                  2,
              ),
              (
                  "PostgreSQL audit target migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.venue."
                      "AuditLogTargetMigrationPostgresTest.xml"
                  ),
                  2,
              ),
              (
                  "H2 guest idempotency fingerprint migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest."
                      "GuestBatchIdempotencyFingerprintMigrationH2Test.xml"
                  ),
                  2,
              ),
              (
                  "PostgreSQL guest idempotency fingerprint migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.miniapp.guest."
                      "GuestBatchIdempotencyFingerprintMigrationPostgresTest.xml"
                  ),
                  2,
              ),
              (
                  "H2 booking thread integrity migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                  "BookingThreadIntegrityMigrationH2Test.xml"
                  ),
                  42,
              ),
              (
                  "PostgreSQL booking thread integrity migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                  "BookingThreadIntegrityMigrationPostgresTest.xml"
                  ),
                  42,
              ),
              (
                  "booking audit recursive-key PG/H2/preflight predicate parity",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "BookingAuditReferencePolicyTest.xml"
                  ),
                  6,
              ),
              (
                  "H2 booking Mini App message idempotency migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                  "BookingMessageIdempotencyMigrationH2Test.xml"
                  ),
                  5,
              ),
              (
                  "PostgreSQL booking Mini App message idempotency migration",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                  "BookingMessageIdempotencyMigrationPostgresTest.xml"
                  ),
                  5,
              ),
              (
                  "PostgreSQL booking thread migration lock serialization",
                  report_dir / (
                      "TEST-com.hookah.platform.backend.support."
                      "BookingThreadIntegrityMigrationConcurrencyPostgresTest.xml"
                  ),
                  2,
              ),
          ]
          problems = []
          for label, report, minimum_tests in required_suites:
              if not report.is_file():
                  problems.append(f"missing JUnit XML: {report}")
                  continue
              suite = ElementTree.parse(report).getroot()
              counts = {
                  key: int(suite.attrib.get(key, "0"))
                  for key in ("tests", "skipped", "failures", "errors")
              }
              executed = counts["tests"] - counts["skipped"]
              print(
                  f"{label} JUnit: xml={report} "
                  f"discovered={counts['tests']} executed={executed} "
                  f"skipped={counts['skipped']} failures={counts['failures']} "
                  f"errors={counts['errors']} required={minimum_tests}"
              )
              if counts["tests"] < minimum_tests:
                  problems.append(
                      f"incomplete {label} matrix: "
                      f"required={minimum_tests} actual={counts['tests']}"
                  )
              if any(counts[key] for key in ("skipped", "failures", "errors")):
                  problems.append(f"{label} gate failed: {counts}")

          if problems:
              raise SystemExit("\n".join(problems))
          PY

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - backend-ktlint
      - backend-compile
      - backend-release-critical-routes
      - backend-venue-booking-rbac
      - backend-telegram-lightweight
      - backend-migration-sanity
    steps:
      - name: Aggregate backend checks
        run: |
          echo "backend-ktlint result: ${{ needs.backend-ktlint.result }}"
          echo "backend-compile result: ${{ needs.backend-compile.result }}"
          echo "backend-release-critical-routes result: ${{ needs.backend-release-critical-routes.result }}"
          echo "backend-venue-booking-rbac result: ${{ needs.backend-venue-booking-rbac.result }}"
          echo "backend-telegram-lightweight result: ${{ needs.backend-telegram-lightweight.result }}"
          echo "backend-migration-sanity result: ${{ needs.backend-migration-sanity.result }}"

          if [[ "${{ needs.backend-ktlint.result }}" != "success" || \
                "${{ needs.backend-compile.result }}" != "success" || \
                "${{ needs.backend-release-critical-routes.result }}" != "success" || \
                "${{ needs.backend-venue-booking-rbac.result }}" != "success" || \
                "${{ needs.backend-telegram-lightweight.result }}" != "success" || \
                "${{ needs.backend-migration-sanity.result }}" != "success" ]]; then
            echo "backend checks failed"
            exit 1
          fi

          echo "backend checks passed"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create CI compose env
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=hookah
          POSTGRES_USER=hookah
          POSTGRES_PASSWORD=ci-placeholder-password
          EOF
      - name: Validate Docker Compose config
        run: docker compose config --quiet

  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Detect miniapp lockfile
        id: miniapp-lockfile
        run: |
          cd miniapp
          lockfiles=()
          if [ -f pnpm-lock.yaml ]; then
            lockfiles+=("pnpm-lock.yaml")
          fi
          if [ -f package-lock.json ]; then
            lockfiles+=("package-lock.json")
          fi
          if [ -f yarn.lock ]; then
            lockfiles+=("yarn.lock")
          fi
          if [ ${#lockfiles[@]} -eq 0 ]; then
            echo "::error::No lockfile found in miniapp/. Expected pnpm-lock.yaml, package-lock.json, or yarn.lock."
            exit 1
          fi
          if [ ${#lockfiles[@]} -gt 1 ]; then
            echo "::warning::Multiple lockfiles detected in miniapp/: ${lockfiles[*]}. Using priority pnpm > npm > yarn."
          fi
          if [ -f pnpm-lock.yaml ]; then
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.miniapp-lockfile.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: 9
      - name: Install dependencies
        working-directory: miniapp
        run: |
          case "${{ steps.miniapp-lockfile.outputs.package_manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            *)
              echo "::error::Unknown package manager."
              exit 1
              ;;
          esac
      - name: Build miniapp
        working-directory: miniapp
        run: |
          case "${{ steps.miniapp-lockfile.outputs.package_manager }}" in
            pnpm)
              pnpm build
              ;;
            npm)
              npm run build
              ;;
            yarn)
              yarn build
              ;;
            *)
              echo "::error::Unknown package manager."
              exit 1
              ;;
          esac

  miniapp-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: miniapp
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: miniapp
        run: npx playwright install --with-deps chromium
      - name: Run full Mini App browser smoke with structured JSON report
        working-directory: miniapp
        env:
          CI: "1"
          TZ: UTC
          MINIAPP_E2E_PORT: "5174"
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-results.json
        run: npm run e2e:smoke -- --reporter=list,json
      - name: Assert full Mini App browser smoke results
        if: ${{ !cancelled() }}
        working-directory: miniapp
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("playwright-results.json")
          minimum_executed = 206
          if not report_path.is_file():
              raise SystemExit(f"missing Playwright JSON report: {report_path}")

          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid Playwright JSON report {report_path}: {error}") from error

          stats = report.get("stats")
          if not isinstance(stats, dict):
              raise SystemExit(f"missing Playwright stats object: {report_path}")

          required_stats = ("expected", "unexpected", "flaky", "skipped")
          invalid_stats = {
              key: stats.get(key)
              for key in required_stats
              if (
                  not isinstance(stats.get(key), int)
                  or isinstance(stats.get(key), bool)
                  or stats.get(key) < 0
              )
          }
          if invalid_stats:
              raise SystemExit(f"invalid Playwright stats in {report_path}: {invalid_stats}")

          suites = report.get("suites")
          if not isinstance(suites, list):
              raise SystemExit(f"invalid Playwright suites array: {report_path}")

          def iter_tests(suite):
              for spec in suite.get("specs", []):
                  yield from spec.get("tests", [])
              for child in suite.get("suites", []):
                  yield from iter_tests(child)

          try:
              reported_tests = [test for suite in suites for test in iter_tests(suite)]
              outcome_counts = {
                  key: sum(test.get("status") == key for test in reported_tests)
                  for key in required_stats
              }
              unknown_outcomes = [
                  test.get("status")
                  for test in reported_tests
                  if test.get("status") not in required_stats
              ]
          except (AttributeError, TypeError) as error:
              raise SystemExit(f"invalid Playwright suite structure: {error}") from error

          if unknown_outcomes:
              raise SystemExit(f"unknown Playwright outcomes: {unknown_outcomes}")
          stats_outcomes = {key: stats[key] for key in required_stats}
          if outcome_counts != stats_outcomes:
              raise SystemExit(
                  f"Playwright stats/suite mismatch: stats={stats_outcomes} "
                  f"suite_outcomes={outcome_counts}"
              )

          expected = stats["expected"]
          unexpected = stats["unexpected"]
          failures = unexpected
          flaky = stats["flaky"]
          skipped = stats["skipped"]
          executed = expected + unexpected + flaky
          runner_errors = report.get("errors")
          if not isinstance(runner_errors, list):
              raise SystemExit(f"invalid Playwright errors array: {report_path}")

          missing_results = sum(
              test["status"] != "skipped" and not test.get("results")
              for test in reported_tests
          )
          non_passing_expectations = sum(
              test["status"] != "skipped" and test.get("expectedStatus") != "passed"
              for test in reported_tests
          )
          failed_attempts = sum(
              result.get("status") != "passed"
              for test in reported_tests
              if test["status"] != "skipped"
              for result in test.get("results", [])
          )

          print(
              f"Playwright JSON: report={report_path} executed={executed} "
              f"expected={expected} failures={failures} flaky={flaky} "
              f"skipped={skipped} runner_errors={len(runner_errors)} "
              f"failed_attempts={failed_attempts} "
              f"required_executed={minimum_executed}"
          )

          problems = []
          if executed < minimum_executed:
              problems.append(
                  f"incomplete Mini App smoke: required={minimum_executed} actual={executed}"
              )
          if failures:
              problems.append(f"failed Playwright tests: {failures}")
          if flaky:
              problems.append(f"flaky Playwright outcomes: {flaky}")
          if skipped:
              problems.append(f"skipped Playwright tests: {skipped}")
          if runner_errors:
              problems.append(f"Playwright runner errors: {len(runner_errors)}")
          if missing_results:
              problems.append(f"Playwright tests without execution results: {missing_results}")
          if non_passing_expectations:
              problems.append(
                  f"Playwright tests with non-passing expected status: {non_passing_expectations}"
              )
          if failed_attempts:
              problems.append(f"failed Playwright attempts: {failed_attempts}")
          if problems:
              raise SystemExit("\n".join(problems))
          PY

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        target: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile .
